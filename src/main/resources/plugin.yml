name: LuckyChests
main: me.blin4ik322.luckychests.LuckyChests
version: '1.0'
api-version: '1.20'
author: blin4ik322
description: LuckyChests - лут-сундуки + модули AutoMelter, ExpBoost, WitherBoost, Кланы и Вложения

commands:
  melt:
    description: Включить/выключить автоплавку руды. Доступна всем игрокам.
    usage: /melt
  плавить:
    description: Включить/выключить автоплавку руды (алиас). Доступна всем игрокам.
    usage: /плавить
  expboost:
    description: Настроить множитель выпадающего опыта. Только для операторов.
    usage: /expboost <множитель|off>
    permission: luckychests.expboost
  witherchance:
    description: Настроить множитель шанса выпадения черепа визера. Только для операторов.
    usage: /witherchance <множитель|off>
    permission: luckychests.witherchance
  clan:
    description: Управление кланами (создание, вступление, лидерство, очки ClanScores и т.д.). Доступна всем игрокам.
    usage: /clan <create|leave|disband|invite|accept|rename|leader|score> [аргументы]
    aliases: [клан]
  top:
    description: Показать топ кланов по очкам (ClanScores). Доступна всем игрокам.
    usage: /top
    aliases: [топ, clantop]
  event:
    description: Управление ивентом сужения барьера мира (WorldBorderTimer). Только для операторов.
    usage: /event <start <время> <радиус>|stop>
    aliases: [ивент, барьер]
    permission: luckychests.event
  invest:
    description: Меню вложений (виртуальный сундук) + управление ценником предметов. Открытие меню доступно всем игрокам.
    usage: /invest [add <предмет> <очки>|remove <предмет>|list]
    aliases: [вложить]

permissions:
  luckychests.expboost:
    description: Доступ к команде /expboost
    default: op
  luckychests.witherchance:
    description: Доступ к команде /witherchance
    default: op
  luckychests.clan.score:
    description: Доступ к команде /clan score (ручное начисление очков клану)
    default: op
  luckychests.event:
    description: Доступ к команде /event (запуск/остановка сужения барьера мира)
    default: op
  luckychests.invest.admin:
    description: Доступ к /invest add|remove|list (настройка ценника вложений)
    default: op